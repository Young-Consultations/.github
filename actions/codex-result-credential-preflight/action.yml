name: Codex result credential preflight
description: Verify the result-delivery credential before cost-bearing execution.

inputs:
  result-token:
    description: Result-only source-repository credential.
    required: true
  source-issue:
    description: Source issue that will receive the result journal and projection.
    required: true
  execution-input-json:
    description: Optional canonical input for trusted terminal-result preflight; required by new safety-aware consumers.
    required: false
    default: ""

outputs:
  prior-effect-class:
    description: none, managed-draft, or not-checked; managed-draft requires owned-PR reconciliation before any Codex call.
    value: ${{ steps.verify.outputs.prior_effect_class }}

runs:
  using: composite
  steps:
    - name: Install receiver validator dependency
      shell: bash
      run: python -m pip install --disable-pip-version-check --no-input 'jsonschema[format]==4.26.0'
    - name: Verify result credential identity and source access
      id: verify
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.result-token }}
        SOURCE_ISSUE: ${{ inputs.source-issue }}
        EXECUTION_INPUT_JSON: ${{ inputs.execution-input-json }}
      run: python3 "$GITHUB_ACTION_PATH/../../scripts/codex_result_credential_preflight.py"
