name: Codex result receiver control-plane bundle
description: Run the immutable result receiver and its control-plane trust policy.

inputs:
  result-token:
    description: Result-only source-repository credential.
    required: true
  execution-result:
    description: Complete canonical execution-result/v2 JSON object.
    required: true
  source-issue:
    description: Source issue bound to the admitted delivery.
    required: true
  caller-repository:
    description: Target repository authenticated by the reusable-workflow caller context.
    required: true
  control-plane-release:
    description: Immutable control-plane release expected in the admission record.
    required: true

runs:
  using: composite
  steps:
    - name: Install receiver validator dependency
      shell: bash
      run: python -m pip install --disable-pip-version-check --no-input 'jsonschema[format]==4.26.0'
    - name: Validate, journal, and forward the canonical result
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.result-token }}
        EXECUTION_RESULT: ${{ inputs.execution-result }}
        SOURCE_ISSUE: ${{ inputs.source-issue }}
        CALLER_REPOSITORY: ${{ inputs.caller-repository }}
        CONTROL_PLANE_RELEASE: ${{ inputs.control-plane-release }}
      run: python3 "$GITHUB_ACTION_PATH/../../scripts/codex_result_receiver.py"
