name: AI-SDLC Target Compatibility

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Disabled target to verify, or all registered targets
        required: true
        default: all
        type: choice
        options:
          - all
          - Young-Consultations/.github
          - Young-Consultations/portfolio-tasks
          - Young-Consultations/consulting-playbook
          - Young-Consultations/slugger
  schedule:
    - cron: '17 6 * * *'
  pull_request:
    paths:
      - 'config/codex-repositories.json'
      - 'config/codex-activation.json'
      - 'scripts/verify_target_workflows.py'
      - 'scripts/verify_release_target_workflows.py'
      - 'tests/test_target_workflow_compatibility.py'
      - 'tests/test_release_target_verifier.py'
      - 'release/release-manifest.json'
      - '.github/workflows/target-workflow-compatibility.yml'

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Offline interface contract / live fail-closed gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run offline compatibility tests
        run: python -m pytest tests/test_target_workflow_compatibility.py tests/test_release_target_verifier.py
      - name: Verify canonical target fixture on pull requests
        if: ${{ github.event_name == 'pull_request' }}
        run: python scripts/verify_target_workflows.py --fixtures-only
      - name: Verify selected registered target workflows
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.CODEX_ROUTER_TOKEN }}
          SELECTED_REPOSITORY: ${{ inputs.repository || 'all' }}
        shell: bash
        run: |
          set -euo pipefail
          verification_status=0
          verify_repository() {
            local repository="$1"
            local report_name
            report_name="$(printf '%s' "$repository" | tr '/.' '--')"
            if ! python scripts/verify_release_target_workflows.py \
                --repository "$repository" \
                --report "reports/${report_name}.json"; then
              verification_status=1
            fi
          }

          if [[ "$SELECTED_REPOSITORY" == "all" ]]; then
            verify_repository "Young-Consultations/.github"
            verify_repository "Young-Consultations/portfolio-tasks"
            verify_repository "Young-Consultations/consulting-playbook"
            verify_repository "Young-Consultations/slugger"
          else
            verify_repository "$SELECTED_REPOSITORY"
          fi

          exit "$verification_status"
      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: target-workflow-compatibility
          path: reports/*.json
          if-no-files-found: error
