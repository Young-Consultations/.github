name: AI-SDLC Target Compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
  pull_request:
    paths:
      - 'config/codex-repositories.json'
      - 'scripts/verify_target_workflows.py'
      - 'tests/test_target_workflow_compatibility.py'
      - '.github/workflows/target-workflow-compatibility.yml'

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run offline compatibility tests
        run: python -m pytest tests/test_target_workflow_compatibility.py
      - name: Verify registered target workflows
        env:
          GH_TOKEN: ${{ secrets.CODEX_ROUTER_TOKEN }}
        run: python scripts/verify_target_workflows.py
      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: target-workflow-compatibility
          path: reports/target-workflow-compatibility.json
          if-no-files-found: error
