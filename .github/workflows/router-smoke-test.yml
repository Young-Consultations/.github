name: Router smoke test

on:
  workflow_dispatch:
    inputs:
      task_payload:
        description: Canonical task-contract/v2 JSON for a non-production smoke task
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  route:
    uses: Young-Consultations/.github/.github/workflows/codex-router.yml@main
    permissions:
      contents: read
      actions: read
    with:
      task_payload: ${{ inputs.task_payload }}
      execution_mode: verify
    secrets:
      CODEX_ROUTER_TOKEN: ${{ secrets.CODEX_ROUTER_TOKEN }}
