name: Codex result receiver

on:
  workflow_call:
    inputs:
      execution_result:
        description: Complete canonical execution-result/v2 JSON object.
        required: true
        type: string
      source_issue:
        description: Source issue bound to the admitted delivery.
        required: true
        type: string
    secrets:
      CODEX_RESULT_TOKEN:
        description: Result-only repository-scoped identity; no target write, merge, release, or deploy authority.
        required: true
      CODEX_TRUSTED_JOURNAL_AUTHORS:
        description: Comma-separated GitHub App or bot logins authorized to write admission and receiver markers.
        required: true
    outputs:
      accepted:
        description: Receipt acceptance only; never execution success.
        value: ${{ jobs.receive.outputs.accepted }}
      delivery_id:
        value: ${{ jobs.receive.outputs.delivery_id }}
      correlation_id:
        value: ${{ jobs.receive.outputs.correlation_id }}
      execution_status:
        value: ${{ jobs.receive.outputs.execution_status }}
      failure_category:
        value: ${{ jobs.receive.outputs.failure_category }}
      diagnostic_summary:
        value: ${{ jobs.receive.outputs.diagnostic_summary }}

permissions:
  contents: read

jobs:
  receive:
    runs-on: ubuntu-latest
    concurrency:
      group: result-${{ inputs.source_issue }}
      cancel-in-progress: false
    outputs:
      accepted: ${{ steps.receive.outputs.accepted }}
      delivery_id: ${{ steps.receive.outputs.delivery_id }}
      correlation_id: ${{ steps.receive.outputs.correlation_id }}
      execution_status: ${{ steps.receive.outputs.execution_status }}
      failure_category: ${{ steps.receive.outputs.failure_category }}
      diagnostic_summary: ${{ steps.receive.outputs.diagnostic_summary }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Young-Consultations/.github
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check 'jsonschema[format]>=4.18,<5'
      - id: receive
        env:
          GH_TOKEN: ${{ secrets.CODEX_RESULT_TOKEN }}
          EXECUTION_RESULT: ${{ inputs.execution_result }}
          SOURCE_ISSUE: ${{ inputs.source_issue }}
          CALLER_REPOSITORY: ${{ github.repository }}
          CODEX_TRUSTED_JOURNAL_AUTHORS: ${{ secrets.CODEX_TRUSTED_JOURNAL_AUTHORS }}
        run: python3 scripts/codex_result_receiver.py
