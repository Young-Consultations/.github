name: Router contract tests

on:
  pull_request:
    paths:
      - '.github/workflows/codex-router.yml'
      - 'config/codex-repositories.json'
      - 'contracts/**'
      - 'scripts/codex_router.py'
      - 'tests/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/codex-router.yml'
      - 'config/codex-repositories.json'
      - 'contracts/**'
      - 'scripts/codex_router.py'
      - 'tests/**'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate registry
        run: python scripts/codex_router.py validate-registry
      - name: Run contract and routing tests
        run: pytest -q
