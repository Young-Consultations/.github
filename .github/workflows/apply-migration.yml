name: Apply Consulting Asset Migration

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip git push and PR creation)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

jobs:
  migrate:
    name: Apply migration patches and open PRs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout .github repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      # ────────────────────────────────────────────────────────────────────────
      # consulting-playbook
      # ────────────────────────────────────────────────────────────────────────

      - name: Clone consulting-playbook
        run: |
          git clone https://x-access-token:${{ secrets.CODEX_ROUTER_TOKEN }}@github.com/Young-Consultations/consulting-playbook /tmp/consulting-playbook

      - name: Apply patch to consulting-playbook
        run: |
          cd /tmp/consulting-playbook
          git checkout -b copilot/migrate-consulting-assets
          git am "$GITHUB_WORKSPACE/migration/0001-consulting-playbook-migrate-assets.patch"

      - name: Push consulting-playbook branch
        if: ${{ !inputs.dry_run }}
        run: |
          cd /tmp/consulting-playbook
          git push origin copilot/migrate-consulting-assets

      - name: Open PR in consulting-playbook
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.CODEX_ROUTER_TOKEN }}
        run: |
          gh pr create \
            --repo Young-Consultations/consulting-playbook \
            --head copilot/migrate-consulting-assets \
            --base main \
            --draft \
            --title "Migrate consulting operating assets from Slugger" \
            --body "Adds 37 consulting files under \`playbooks/\` with a lifecycle-aligned structure. Applied via the apply-migration workflow in Young-Consultations/.github."

      # ────────────────────────────────────────────────────────────────────────
      # slugger
      # ────────────────────────────────────────────────────────────────────────

      - name: Clone slugger
        run: |
          git clone https://x-access-token:${{ secrets.CODEX_ROUTER_TOKEN }}@github.com/Young-Consultations/slugger /tmp/slugger

      - name: Apply patch to slugger
        run: |
          cd /tmp/slugger
          git checkout -b copilot/remove-consulting-assets
          git am "$GITHUB_WORKSPACE/migration/0002-slugger-remove-assets.patch"

      - name: Push slugger branch
        if: ${{ !inputs.dry_run }}
        run: |
          cd /tmp/slugger
          git push origin copilot/remove-consulting-assets

      - name: Open PR in slugger
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.CODEX_ROUTER_TOKEN }}
        run: |
          gh pr create \
            --repo Young-Consultations/slugger \
            --head copilot/remove-consulting-assets \
            --base main \
            --draft \
            --title "Remove consulting assets after consulting-playbook extraction" \
            --body "Removes \`consulting/\` from Slugger and updates README to link to consulting-playbook. Applied via the apply-migration workflow in Young-Consultations/.github."

      - name: Migration summary
        if: ${{ !inputs.dry_run }}
        run: |
          echo "Migration complete."
          echo "  consulting-playbook PR: https://github.com/Young-Consultations/consulting-playbook/compare/copilot/migrate-consulting-assets"
          echo "  slugger PR:             https://github.com/Young-Consultations/slugger/compare/copilot/remove-consulting-assets"

      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "Dry run complete — no branches pushed, no PRs created."
          echo "  consulting-playbook branch would be: copilot/migrate-consulting-assets"
          echo "  slugger branch would be:             copilot/remove-consulting-assets"
