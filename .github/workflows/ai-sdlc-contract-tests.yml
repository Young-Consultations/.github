name: AI-SDLC Contract Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'config/**'
      - 'contracts/**'
      - 'docs/**'
      - 'release/**'
      - 'scripts/validate_release.py'
      - 'scripts/codex_router.py'
      - 'src/ai_sdlc_contracts/**'
      - 'tests/**'
      - 'README.md'
      - 'pyproject.toml'
      - 'requirements-dev.txt'

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'

jobs:
  shared-contract-schemas:
    name: Shared contract schemas
    runs-on: ubuntu-latest
    outputs:
      contract-version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify canonical contract version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat contracts/contract-version.txt)"
          test "$version" = 'ai-sdlc-contract/v2'
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Run canonical schema tests
        run: python -m pytest tests/test_contract_schemas.py --junitxml=reports/schema.xml
      - name: Run pinned TC-MVP-CI-001 conformance oracle
        run: python scripts/run_tc_mvp_ci_001.py --report reports/tc-mvp-ci-001.json
      - name: Upload schema report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-sdlc-contract-test-results-schemas
          path: |
            reports/schema.xml
            reports/tc-mvp-ci-001.json
          if-no-files-found: error

  python-validation-library:
    name: Shared Python validation library
    needs: shared-contract-schemas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install . pytest
      - name: Run validation-library tests
        run: python -m pytest tests/test_ai_sdlc_contracts.py --junitxml=reports/library.xml
      - name: Build and inspect wheel resources
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install build
          python -m build
          python -m zipfile -l dist/*.whl | tee wheel-contents.txt
          for resource in \
            ai_sdlc_contracts/contracts/contract-version.txt \
            ai_sdlc_contracts/contracts/task-contract.schema.json \
            ai_sdlc_contracts/contracts/execution-input.schema.json \
            ai_sdlc_contracts/contracts/execution-result.schema.json; do
            grep -F "$resource" wheel-contents.txt
          done
      - name: Verify wheel in a clean virtual environment outside checkout
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/contracts-venv"
          "$RUNNER_TEMP/contracts-venv/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/contracts-venv/bin/python" -c \
            'from ai_sdlc_contracts import load_contract_version; assert load_contract_version() == "ai-sdlc-contract/v2"'
          "$RUNNER_TEMP/contracts-venv/bin/python" -m ai_sdlc_contracts validate-task "$GITHUB_WORKSPACE/contracts/examples/valid-task.json"
          "$RUNNER_TEMP/contracts-venv/bin/python" -m ai_sdlc_contracts validate-input "$GITHUB_WORKSPACE/contracts/examples/valid-execution-input.json"
          "$RUNNER_TEMP/contracts-venv/bin/python" -m ai_sdlc_contracts validate-result "$GITHUB_WORKSPACE/contracts/examples/valid-execution-result.json"
      - name: Verify explicit user installation outside checkout
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONUSERBASE="$RUNNER_TEMP/contracts-user-base"
          python -m pip uninstall --yes ai-sdlc-contracts
          python -m pip install --user --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -m ai_sdlc_contracts validate-task "$GITHUB_WORKSPACE/contracts/examples/valid-task.json"
          python -m ai_sdlc_contracts validate-input "$GITHUB_WORKSPACE/contracts/examples/valid-execution-input.json"
          python -m ai_sdlc_contracts validate-result "$GITHUB_WORKSPACE/contracts/examples/valid-execution-result.json"
      - name: Verify editable install against canonical examples
        run: |
          python -m pip install --editable .
          python -m ai_sdlc_contracts validate-task contracts/examples/valid-task.json
          python -m ai_sdlc_contracts validate-input contracts/examples/valid-execution-input.json
          python -m ai_sdlc_contracts validate-result contracts/examples/valid-execution-result.json
      - name: Upload validation-library report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-sdlc-contract-test-results-library
          path: reports/library.xml
          if-no-files-found: error

  router-contract-tests:
    name: Organization router contracts
    needs: python-validation-library
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate registry
        run: python scripts/codex_router.py validate-registry
      - name: Run router contract tests
        run: python -m pytest tests/test_codex_router.py --junitxml=reports/router.xml
      - name: Upload router report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-sdlc-contract-test-results-router
          path: reports/router.xml
          if-no-files-found: error

  static-contract-checks:
    name: Static contract and integration checks
    needs: router-contract-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate registry JSON syntax
        run: python -m json.tool config/codex-repositories.json >/dev/null
      - name: Validate contract JSON syntax
        shell: bash
        run: |
          set -euo pipefail
          find contracts -type f -name '*.json' -print0 | xargs -0 -n1 python -m json.tool >/dev/null
      - name: Run static security and integration-boundary tests
        run: python -m pytest tests/test_static_contract.py tests/test_release_lifecycle.py --junitxml=reports/static.xml
      - name: Validate coherent release manifest
        run: python scripts/validate_release.py
      - name: Check patch whitespace
        run: |
          git diff --check
          git diff --check HEAD^ HEAD
      - name: Run actionlint when available
        shell: bash
        run: |
          if command -v actionlint >/dev/null 2>&1; then
            actionlint
          else
            echo '::notice::actionlint is not available on this runner and was not run.'
          fi
      - name: Upload static-check report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-sdlc-contract-test-results-static
          path: reports/static.xml
          if-no-files-found: error

  verification-summary:
    name: Verification summary
    needs:
      - shared-contract-schemas
      - python-validation-library
      - router-contract-tests
      - static-contract-checks
    runs-on: ubuntu-latest
    steps:
      - name: Publish verification summary
        env:
          CONTRACT_VERSION: ${{ needs.shared-contract-schemas.outputs.contract-version }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          {
            echo '## AI-SDLC contract verification'
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Contract version | \`$CONTRACT_VERSION\` |"
            echo '| Schema tests | Passed |'
            echo '| Validation library | Passed |'
            echo '| Router contracts | Passed |'
            echo '| Static and integration checks | Passed |'
            echo "| Commit SHA | \`$COMMIT_SHA\` |"
            echo "| Workflow run | [Open run]($RUN_URL) |"
          } >> "$GITHUB_STEP_SUMMARY"
