name: Default Branch Governance Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Verify live default-branch rulesets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run offline governance tests
        run: python -m pytest tests/test_default_branch_governance.py
      - name: Audit live rulesets
        env:
          GITHUB_TOKEN: ${{ secrets.DEFAULT_BRANCH_GOVERNANCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "::error::DEFAULT_BRANCH_GOVERNANCE_TOKEN is required for cross-repository ruleset verification."
            exit 1
          fi
          python scripts/audit_default_branch_governance.py --json
