[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sdlc-contracts"
version = "2.4.1"
description = "Validation helpers for the canonical AI-SDLC contracts"
requires-python = ">=3.9"
dependencies = ["jsonschema[format]>=4.18,<5"]

[project.scripts]
ai-sdlc-contracts = "ai_sdlc_contracts.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.package-data]
ai_sdlc_contracts = [
  "contracts/*.json",
  "contracts/*.txt",
]
