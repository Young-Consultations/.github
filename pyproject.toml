[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sdlc-contracts"
version = "1.0.0"
description = "Validation helpers for the canonical AI-SDLC contracts"
requires-python = ">=3.9"
dependencies = ["jsonschema[format]>=4.18,<5"]

[project.scripts]
ai-sdlc-contracts = "ai_sdlc_contracts.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.data-files]
"share/ai-sdlc-contracts/contracts" = [
  "contracts/contract-version.txt",
  "contracts/task-contract.schema.json",
  "contracts/execution-input.schema.json",
  "contracts/execution-result.schema.json",
]
